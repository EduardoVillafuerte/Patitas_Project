<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12332d">
  <!-- Tipografías: Bricolage Grotesque (títulos) y Figtree (texto). Sin internet, el navegador usa la fuente del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
  <title th:text="${titulo} + ' | Patitas'">Patitas</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- BARRA DE NAVEGACIÓN: sec:authorize muestra cada enlace solo al rol que corresponde. -->
<nav th:fragment="nav" class="nav" aria-label="Navegación principal">
  <!-- La huella es un SVG dibujado aquí mismo (no depende de emojis, que se ven distinto en cada sistema). -->
  <a class="brand" th:href="@{/}">
    <svg class="marca" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="5.5" r="2.2"/><circle cx="14.5" cy="5.5" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/>
      <path d="M12 11c-3 0-6 3.2-6 6 0 2 1.6 3 3.2 3 1.2 0 1.9-.6 2.8-.6s1.6.6 2.8.6c1.6 0 3.2-1 3.2-3 0-2.8-3-6-6-6z"/>
    </svg>
    <span>Patitas<span class="dot">.</span></span>
  </a>

  <!-- Botón de menú: solo se ve en teléfono (el CSS lo oculta en pantallas grandes). -->
  <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="menuPrincipal" aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- Todos los enlaces viven dentro de .nav-links: en escritorio van en fila; en teléfono se despliegan con el botón. -->
  <div class="nav-links" id="menuPrincipal">
  <a th:href="@{/public/inicio}">Mascotas</a>

  <th:block sec:authorize="hasRole('ADOPTANTE')">
    <a th:href="@{/adoptante/catalogo}">Mi catálogo</a>
    <a th:href="@{/adoptante/postulaciones}">Mis postulaciones</a>
    <a th:href="@{/adoptante/perfil}">Mi perfil</a>
  </th:block>

  <th:block sec:authorize="hasRole('REFUGIO')">
    <a th:href="@{/refugio/panel}">Mi refugio</a>
    <a th:href="@{/refugio/postulaciones}">Postulaciones</a>
  </th:block>

  <th:block sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/admin/panel}">Administración</a>
  </th:block>

  <th:block sec:authorize="isAnonymous()">
    <a th:href="@{/login}">Ingresar</a>
    <a th:href="@{/registro}">Crear cuenta</a>
  </th:block>

  <th:block sec:authorize="isAuthenticated()">
    <span class="who" sec:authentication="name">usuario</span>
    <!-- El logout es POST (con token CSRF automático gracias a th:action). -->
    <form th:action="@{/logout}" method="post"><button type="submit">Salir</button></form>
  </th:block>
  </div>

  <script>
    // Abre y cierra el menú en teléfono. document.currentScript.parentElement es este mismo <nav>.
    (function () {
      var nav = document.currentScript.parentElement;
      var boton = nav.querySelector('.nav-toggle');
      boton.addEventListener('click', function () {
        var abierto = nav.classList.toggle('abierto');
        boton.setAttribute('aria-expanded', String(abierto));
        boton.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
      });
    })();
  </script>
</nav>

<!-- MENSAJES FLASH: role="status"/"alert" hace que los lectores de pantalla los anuncien. -->
<div th:fragment="mensajes">
  <div class="alert ok" role="status" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert err" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

<!-- FOTO de la mascota. Si no tiene imagen, muestra la inicial de su nombre sobre un fondo plano.
     El th:text con "? :" evita un error si el nombre llegara vacío (prevención de null/vacío). -->
<div th:fragment="foto(m)" class="foto">
  <img th:if="${m.tieneImagen()}" th:src="@{/public/mascotas/{id}/imagen(id=${m.id})}" th:alt="'Foto de ' + ${m.nombre}" loading="lazy">
  <span th:unless="${m.tieneImagen()}" class="inicial" aria-hidden="true"
        th:text="${#strings.isEmpty(m.nombre)} ? '?' : ${#strings.toUpperCase(#strings.substring(m.nombre, 0, 1))}">P</span>
</div>

<!-- ETIQUETA DE ESTADO legible: convierte EN_PROCESO -> "En proceso" (la clase CSS conserva el valor original). -->
<span th:fragment="estado(valor)" class="tag" th:classappend="'estado-' + ${valor}"
      th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(valor, '_', ' ')))}">Estado</span>

<!-- PIE DE PÁGINA (se agrega al final de cada página con th:replace) -->
<footer th:fragment="pie" class="pie">
  <div class="pie-interior">
    <p class="pie-marca">Patitas<span>.</span></p>
    <p>Cada patita merece un hogar</p>
  </div>
</footer>

</body>
</html>
