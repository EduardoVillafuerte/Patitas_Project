<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${titulo}">Patitas</title></head>
<body style="margin:0;padding:0;background:#f2f6f5;font-family:Arial,Helvetica,sans-serif;color:#1f2d2a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f6f5;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#12332d;padding:18px 24px;color:#ffffff;font-size:20px;font-weight:bold;">Patitas<span style="color:#f2b84b;">.</span></td></tr>
        <tr><td style="padding:28px 24px 8px 24px;">
          <p style="margin:0 0 6px 0;font-size:14px;color:#5b6b67;">Hola, <span th:text="${nombre}">usuario</span></p>
          <h1 style="margin:0 0 14px 0;font-size:22px;line-height:1.3;" th:text="${titulo}">Título</h1>
          <p style="margin:0 0 22px 0;font-size:15px;line-height:1.6;" th:text="${mensaje}">Mensaje</p>
          <p style="margin:0 0 26px 0;" th:if="${url != null}">
            <a th:href="${url}" th:text="${textoBoton}" style="background:#2f9e8f;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;display:inline-block;">Abrir Patitas</a>
          </p>
        </td></tr>
        <tr><td style="padding:16px 24px 24px 24px;border-top:1px solid #e3ebe9;font-size:12px;color:#8a9894;">
          Cada patita merece un hogar. Este es un mensaje automático de Patitas.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
